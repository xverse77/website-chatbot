<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      background: #f4f4f4;
    }
    #chat-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .message {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.4;
    }
    .user-message {
      background: #DCF8C6;
      margin-left: auto;
    }
    .bot-message {
      background: #E8E8E8;
    }
    #input-area {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 10px;
    }
    #question-input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #send-button {
      margin-left: 8px;
      padding: 8px 16px;
      background: #4A90D9;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="question-input" placeholder="Ask a question...">
      <button id="send-button">Send</button>
    </div>
  </div>
  <script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('question-input');
    const button = document.getElementById('send-button');

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = sender === 'user' ? 'message user-message' : 'message bot-message';
      msgDiv.textContent = text;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendQuestion() {
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, 'user');
      input.value = '';

      try {
        const response = await fetch('https://website-chatbot-fsfx.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: question, site_id: 'aps-college' })
        });

        const data = await response.json();
        addMessage(data.answer, 'bot');

      } catch (error) {
        addMessage('Something went wrong — is the backend running?', 'bot');
        console.error(error);
      }
    }

    button.addEventListener('click', sendQuestion);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendQuestion();
    });
  </script>
</body>
</html>
