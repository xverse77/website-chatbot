<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      background: #f4f4f4;
    }
    #chat-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .message {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.4;
    }
    .user-message {
      background: #DCF8C6;
      margin-left: auto;
    }
    .bot-message {
      background: #E8E8E8;
    }
    #input-area {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 10px;
    }
    #question-input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #send-button {
      margin-left: 8px;
      padding: 8px 16px;
      background: #4A90D9;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
    } 
    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: typing-bounce 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    #send-button:disabled {
      background: #a9c3e0;
      cursor: not-allowed;
   }
  </style>
</head>
<body>

  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="question-input" placeholder="Ask a question...">
      <button id="send-button">Send</button>
    </div>
  </div>
  <script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('question-input');
    const button = document.getElementById('send-button');

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatBotText(text) {
  let safe = escapeHTML(text);
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/^\s*\*\s+/gm, '• ');
  safe = safe.replace(/\n/g, '<br>');
  return safe;
}

function addMessage(text, sender) {
  const msgDiv = document.createElement('div');
  msgDiv.className = sender === 'user' ? 'message user-message' : 'message bot-message';

  if (sender === 'user') {
    msgDiv.textContent = text;
  } else {
    msgDiv.innerHTML = formatBotText(text);
  }

  messagesDiv.appendChild(msgDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

    function showTyping() {
  const typingDiv = document.createElement('div');
  typingDiv.className = 'message bot-message typing-indicator';
  typingDiv.id = 'typing-indicator';
  typingDiv.innerHTML = '<span></span><span></span><span></span>';
  messagesDiv.appendChild(typingDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function hideTyping() {
  const typingDiv = document.getElementById('typing-indicator');
  if (typingDiv) typingDiv.remove();
}

async function sendQuestion() {
  const question = input.value.trim();
  if (!question) return;

  addMessage(question, 'user');
  input.value = '';

  button.disabled = true;
  input.disabled = true;
  showTyping();

  try {
    const response = await fetch('https://website-chatbot-fsfx.onrender.com/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question, site_id: 'aps-college' })
    });

    const data = await response.json();
    hideTyping();
    addMessage(data.answer, 'bot');

  } catch (error) {
    hideTyping();
    addMessage('Something went wrong — is the backend running?', 'bot');
    console.error(error);
  } finally {
    button.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

    button.addEventListener('click', sendQuestion);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendQuestion();
    });
  </script>
</body>
</html>
